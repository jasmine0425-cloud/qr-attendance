<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>심화반 QR 입·퇴실</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f8;
      color: #222;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 20px;
      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #666;
      font-size: 16px;
    }

    #statusText {
      margin: 18px 0;
      padding: 16px;
      background: white;
      border-radius: 14px;
      font-size: 19px;
      font-weight: bold;
    }


    /* =========================
       처음 입실 / 퇴실 선택
    ========================= */

    #modeBox {
      margin-top: 25px;
    }

    .modeTitle {
      margin-bottom: 20px;
      font-size: 21px;
      font-weight: bold;
    }

    .modeButtons {
      display: flex;
      gap: 15px;
    }

    .modeButton {
      flex: 1;
      min-height: 120px;
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    #selectIn {
      background: #20a464;
    }

    #selectOut {
      background: #e14b4b;
    }

    .modeButton:active {
      transform: scale(0.98);
    }


    /* =========================
       QR 카메라
    ========================= */

    #scannerBox {
      display: none;
    }

    #selectedMode {
      margin: 20px 0 10px;
      padding: 16px;
      border-radius: 14px;
      font-size: 24px;
      font-weight: bold;
    }

    .mode-in {
      background: #e7f7ef;
      color: #147744;
    }

    .mode-out {
      background: #fdecec;
      color: #b72f2f;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }

    .cameraControls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .cameraButton {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #switchCameraButton {
      background: #444;
      color: white;
    }

    #cancelButton {
      background: #ddd;
      color: #222;
    }


    /* =========================
       완료 화면
    ========================= */

    #resultBox {
      display: none;
      margin-top: 25px;
      padding: 35px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    #resultIcon {
      font-size: 45px;
    }

    #resultTitle {
      margin: 12px 0;
      font-size: 30px;
      font-weight: bold;
    }

    #resultStudent {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    #resultInfo {
      margin-top: 10px;
      color: #555;
      font-size: 18px;
      line-height: 1.7;
    }

    #errorBox {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f0;
      color: #c92a2a;
      border-radius: 12px;
      font-size: 16px;
    }

    @media(max-width: 500px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 25px;
      }

      .modeButton {
        min-height: 105px;
        font-size: 27px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <h1>심화반 QR 입·퇴실</h1>

  <div class="subtitle">
    입실 또는 퇴실을 선택한 뒤 개인 QR코드를 인식해주세요.
  </div>


  <div id="statusText">
    입실 또는 퇴실을 선택해주세요.
  </div>


  <!-- =====================
       처음 선택 화면
  ====================== -->

  <div id="modeBox">

    <div class="modeTitle">
      무엇을 하시겠습니까?
    </div>

    <div class="modeButtons">

      <button
        id="selectIn"
        class="modeButton"
        onclick="selectMode('IN')">
        🟢<br>
        입실
      </button>

      <button
        id="selectOut"
        class="modeButton"
        onclick="selectMode('OUT')">
        🔴<br>
        퇴실
      </button>

    </div>

  </div>


  <!-- =====================
       QR 스캔 화면
  ====================== -->

  <div id="scannerBox">

    <div id="selectedMode"></div>

    <div id="reader"></div>

    <div class="cameraControls">

      <button
        id="switchCameraButton"
        class="cameraButton"
        onclick="switchCamera()">
        🔄 카메라 전환
      </button>

      <button
        id="cancelButton"
        class="cameraButton"
        onclick="cancelScan()">
        취소
      </button>

    </div>

  </div>


  <!-- =====================
       완료 화면
  ====================== -->

  <div id="resultBox">

    <div id="resultIcon"></div>

    <div id="resultTitle"></div>

    <div id="resultStudent"></div>

    <div id="resultInfo"></div>

  </div>


  <div id="errorBox"></div>

</div>


<script>

/* =========================================
   Google Apps Script 주소
========================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyK5kvtWYRZa-4mVv_YGljLFi0CvxDrhzsy1Uu8EOF8mrHdxnQHtUz4Abrh_8-YgsYk/exec";


/* =========================================
   변수
========================================= */

let qrScanner = null;

let selectedType = null;

let currentFacingMode = "environment";

let scannerRunning = false;

let processing = false;


/* =========================================
   입실 / 퇴실 선택
========================================= */

async function selectMode(type) {

  if (processing) {
    return;
  }

  selectedType = type;

  hideError();

  document.getElementById("modeBox").style.display =
    "none";

  document.getElementById("scannerBox").style.display =
    "block";

  const modeLabel =
    document.getElementById("selectedMode");


  if (type === "IN") {

    modeLabel.className =
      "mode-in";

    modeLabel.innerText =
      "🟢 입실 처리";

    setStatus(
      "개인 QR코드를 카메라에 보여주세요."
    );

  }

  else {

    modeLabel.className =
      "mode-out";

    modeLabel.innerText =
      "🔴 퇴실 처리";

    setStatus(
      "개인 QR코드를 카메라에 보여주세요."
    );

  }


  await startCamera();

}


/* =========================================
   카메라 시작
========================================= */

async function startCamera() {

  try {

    if (!qrScanner) {

      qrScanner =
        new Html5Qrcode(
          "reader",
          {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE
            ]
          }
        );

    }


    await qrScanner.start(

      {
        facingMode:
          currentFacingMode
      },

      {
        fps: 12,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.72;

          return {
            width: size,
            height: size
          };

        }

      },

      qrSuccess,

      function() {
        // QR 미인식은 정상
      }

    );


    scannerRunning =
      true;

  }

  catch(error) {

    console.error(error);

    showError(
      "카메라를 실행할 수 없습니다.<br><br>" +
      String(error)
    );

    setStatus(
      "카메라 실행에 실패했습니다."
    );

  }

}


/* =========================================
   QR 인식 성공
========================================= */

function qrSuccess(
  decodedText,
  decodedResult
) {

  if (processing) {
    return;
  }

  if (!selectedType) {
    return;
  }


  const qrId =
    String(decodedText).trim();


  if (!qrId) {
    return;
  }


  processing =
    true;


  setStatus(
    "학생 정보를 확인하고 있습니다..."
  );


  try {

    qrScanner.pause(true);

  }

  catch(error) {

    console.log(error);

  }


  /*
    QR을 읽으면 바로 입/퇴실 처리

    별도의 버튼을 다시 누르지 않음
  */

  processAttendance(
    qrId,
    selectedType
  );

}


/* =========================================
   Apps Script 입퇴실 요청
========================================= */

function processAttendance(
  qrId,
  type
) {

  setStatus(
    type === "IN"
      ? "입실 처리 중입니다..."
      : "퇴실 처리 중입니다..."
  );


  jsonp(

    {
      action: "attendance",
      qrId: qrId,
      type: type
    },


    function(data) {


      if (!data.success) {

        showError(
          data.message
        );

        setStatus(
          "처리할 수 없습니다."
        );

        setTimeout(
          returnToScanner,
          1800
        );

        return;

      }


      showResult(
        data
      );

    }

  );

}


/* =========================================
   완료 화면
========================================= */

async function showResult(data) {

  try {

    if (scannerRunning) {

      await qrScanner.stop();

      scannerRunning =
        false;

    }

  }

  catch(error) {

    console.log(error);

  }


  document
    .getElementById("scannerBox")
    .style.display =
    "none";


  const resultBox =
    document.getElementById(
      "resultBox"
    );


  const isIn =
    data.type === "IN";


  document
    .getElementById("resultIcon")
    .innerText =
    isIn
      ? "✅"
      : "✅";


  document
    .getElementById("resultTitle")
    .innerText =
    isIn
      ? "입실 완료"
      : "퇴실 완료";


  document
    .getElementById("resultStudent")
    .innerText =
    data.name + " 학생";


  document
    .getElementById("resultInfo")
    .innerHTML =

    data.time +

    "<br>" +

    (
      isIn
        ? "입실 처리가 완료되었습니다."
        : "퇴실 처리가 완료되었습니다."
    );


  resultBox.style.display =
    "block";


  setStatus(
    "처리가 완료되었습니다."
  );


  /*
    2초 후 첫 화면
  */

  setTimeout(
    resetSystem,
    2000
  );

}


/* =========================================
   카메라 전환
========================================= */

async function switchCamera() {

  if (
    !qrScanner ||
    !scannerRunning ||
    processing
  ) {
    return;
  }


  const button =
    document.getElementById(
      "switchCameraButton"
    );


  button.disabled =
    true;


  setStatus(
    "카메라를 전환하고 있습니다..."
  );


  try {

    await qrScanner.stop();

    scannerRunning =
      false;


    currentFacingMode =

      currentFacingMode ===
      "environment"

        ? "user"

        : "environment";


    await startCamera();


    setStatus(
      currentFacingMode ===
      "environment"

        ? "후면 카메라입니다. QR코드를 보여주세요."

        : "전면 카메라입니다. QR코드를 보여주세요."
    );

  }

  catch(error) {

    console.error(error);

    showError(
      "카메라 전환에 실패했습니다."
    );

  }

  finally {

    button.disabled =
      false;

  }

}


/* =========================================
   스캔 취소
========================================= */

async function cancelScan() {

  try {

    if (scannerRunning) {

      await qrScanner.stop();

      scannerRunning =
        false;

    }

  }

  catch(error) {

    console.log(error);

  }


  resetSystem();

}


/* =========================================
   오류 후 다시 스캔
========================================= */

function returnToScanner() {

  processing =
    false;

  hideError();

  setStatus(
    "QR코드를 다시 인식해주세요."
  );


  try {

    if (scannerRunning) {

      qrScanner.resume();

    }

  }

  catch(error) {

    console.log(error);

  }

}


/* =========================================
   첫 화면 초기화
========================================= */

async function resetSystem() {

  try {

    if (
      qrScanner &&
      scannerRunning
    ) {

      await qrScanner.stop();

    }

  }

  catch(error) {

    console.log(error);

  }


  scannerRunning =
    false;

  processing =
    false;

  selectedType =
    null;


  document
    .getElementById("scannerBox")
    .style.display =
    "none";


  document
    .getElementById("resultBox")
    .style.display =
    "none";


  document
    .getElementById("modeBox")
    .style.display =
    "block";


  hideError();


  setStatus(
    "입실 또는 퇴실을 선택해주세요."
  );

}


/* =========================================
   JSONP 통신
========================================= */

function jsonp(
  parameters,
  successCallback
) {

  const callbackName =

    "jsonpCallback_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  const timeout =
    setTimeout(

      function() {

        cleanup();

        showError(
          "서버 응답 시간이 초과되었습니다."
        );

        setTimeout(
          returnToScanner,
          2000
        );

      },

      10000

    );


  function cleanup() {

    clearTimeout(
      timeout
    );


    if (script.parentNode) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    }

    catch(error) {}

  }


  window[
    callbackName
  ] =
  function(data) {

    cleanup();

    successCallback(
      data
    );

  };


  const query =
    new URLSearchParams(
      {
        ...parameters,
        callback:
          callbackName
      }
    );


  script.src =

    APPS_SCRIPT_URL +

    "?" +

    query.toString();


  script.onerror =
    function() {

      cleanup();

      showError(
        "Apps Script 서버와 연결하지 못했습니다."
      );

      setTimeout(
        returnToScanner,
        2000
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================
   화면 표시 함수
========================================= */

function setStatus(text) {

  document
    .getElementById(
      "statusText"
    )
    .innerText =
    text;

}


function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.innerHTML =
    message;

  box.style.display =
    "block";

}


function hideError() {

  document
    .getElementById(
      "errorBox"
    )
    .style.display =
    "none";

}

</script>

</body>
</html>
